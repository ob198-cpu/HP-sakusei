<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARTS 05 — スポットライトカード</title>
<style>body { margin: 0; }</style>
</head>
<body>
<!-- ▼▼▼ COPY START ▼▼▼ -->
<!-- ============================================================
  SAKUTTO PARTS 05: マウス追従スポットライトカード
  使い方: このブロックを丸ごと <body> 内に貼り付け。
  枠線そのものが光って追従する、SaaSサイト風の演出。
  依存: なし(バニラJS)
============================================================ -->
<section class="skp-sc">
  <article class="skp-sc-card">
    <h3>枠線が光る</h3>
    <p>マウス位置を中心に、カードの境界線だけが発光します。</p>
  </article>
  <article class="skp-sc-card">
    <h3>面も光る</h3>
    <p>内側にもうっすらとスポットライトが追従し、奥行きを感じさせます。</p>
  </article>
  <article class="skp-sc-card">
    <h3>隣も反応する</h3>
    <p>グリッド全体で光が連動するので、まとまりのある高級感が出ます。</p>
  </article>
</section>
<style>
  .skp-sc {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 18px;
    padding: 70px clamp(20px, 6vw, 80px);
    background: #0a0a13;
    font-family: 'Inter', 'Noto Sans JP', system-ui, sans-serif;
  }

  .skp-sc-card {
    position: relative;
    padding: 30px 26px;
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.03);
    color: #edefff;
  }

  /* 光る枠線レイヤー */
  .skp-sc-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 1px;
    background:
      radial-gradient(280px circle at var(--skp-x, 50%) var(--skp-y, -40%), rgba(135, 110, 255, 0.95), rgba(135, 110, 255, 0.14) 55%, rgba(255, 255, 255, 0.07));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    pointer-events: none;
  }

  /* 内側のスポットライト */
  .skp-sc-card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(320px circle at var(--skp-x, 50%) var(--skp-y, -40%), rgba(120, 95, 255, 0.14), transparent 60%);
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }

  .skp-sc:hover .skp-sc-card::after {
    opacity: 1;
  }

  .skp-sc-card h3 {
    margin: 0 0 10px;
    font-size: 1.08rem;
    font-weight: 800;
  }

  .skp-sc-card p {
    margin: 0;
    color: rgba(212, 216, 245, 0.7);
    font-size: 0.9rem;
    line-height: 1.9;
  }
</style>
<script>
(() => {
  if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  document.querySelectorAll('.skp-sc').forEach((grid) => {
    grid.addEventListener('pointermove', (event) => {
      grid.querySelectorAll('.skp-sc-card').forEach((card) => {
        const rect = card.getBoundingClientRect();
        card.style.setProperty('--skp-x', `${((event.clientX - rect.left) / rect.width) * 100}%`);
        card.style.setProperty('--skp-y', `${((event.clientY - rect.top) / rect.height) * 100}%`);
      });
    });
  });
})();
</script>
<!-- ▲▲▲ COPY END ▲▲▲ -->
</body>
</html>
