<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARTS 14 — シェーダー水面ヒーロー</title>
<style>body { margin: 0; }</style>
</head>
<body>
<!-- ▼▼▼ COPY START ▼▼▼ -->
<!-- ============================================================
  SAKUTTO PARTS 14: シェーダー水面ヒーロー(WebGL)
  GPUがリアルタイムに計算する水面。マウスで光源が動きます。
  使い方: このブロックを丸ごと <body> 内に貼り付け。
  見出しは .skp-sw-inner の中を差し替え。
  依存: なし(WebGL / 非対応環境はグラデーションにフォールバック)
============================================================ -->
<section class="skp-sw">
  <canvas class="skp-sw-canvas" aria-hidden="true"></canvas>
  <div class="skp-sw-inner">
    <p class="skp-sw-label">GPU RENDERED</p>
    <h1>揺らめく水面を、<br>GPUがその場で計算する。</h1>
    <p class="skp-sw-lead">動画ファイルなし。何分見ても繰り返しのない、生成される水面です。</p>
  </div>
</section>
<style>
  .skp-sw {
    position: relative;
    height: 76vh;
    min-height: 440px;
    overflow: hidden;
    /* WebGL非対応時のフォールバック背景 */
    background:
      radial-gradient(ellipse 80% 60% at 60% 30%, rgba(45, 55, 140, 0.6), transparent 70%),
      #04050e;
  }

  .skp-sw-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .skp-sw-inner {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    gap: 4px;
    text-align: center;
    padding: 24px;
    color: #f2f4ff;
    font-family: 'Inter', 'Noto Sans JP', system-ui, sans-serif;
    pointer-events: none;
  }

  .skp-sw-label {
    margin: 0 0 12px;
    font-size: 0.7rem;
    font-weight: 900;
    letter-spacing: 0.34em;
    color: rgba(165, 180, 255, 0.85);
  }

  .skp-sw-inner h1 {
    margin: 0;
    font-size: clamp(1.8rem, 4.6vw, 3.4rem);
    font-weight: 900;
    line-height: 1.35;
    text-shadow: 0 6px 40px rgba(0, 0, 0, 0.6);
  }

  .skp-sw-lead {
    margin: 18px 0 0;
    color: rgba(216, 222, 255, 0.75);
    font-size: 0.95rem;
  }
</style>
<script>
(() => {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.skp-sw').forEach((root) => {
    const canvas = root.querySelector('.skp-sw-canvas');
    const gl = canvas.getContext('webgl', { antialias: false });
    if (!gl) {
      canvas.remove();
      return;
    }

    const FRAG = `
      precision highp float;
      uniform vec2 uRes;
      uniform float uTime;
      uniform vec2 uMouse;

      float hash(vec2 p) {
        return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
      }

      float noise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        vec2 u = f * f * (3.0 - 2.0 * f);
        return mix(
          mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
          mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
          u.y
        );
      }

      float fbm(vec2 p) {
        float v = 0.0;
        float a = 0.5;
        for (int k = 0; k < 4; k++) {
          v += a * noise(p);
          p *= 2.05;
          a *= 0.5;
        }
        return v;
      }

      float height(vec2 p, float t) {
        return fbm(p * 1.6 + vec2(t * 0.5, t * 0.15)) * 0.7
             + fbm(p * 3.2 - vec2(t * 0.3, t * 0.45)) * 0.3;
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / uRes;
        vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y * 2.6;
        float t = uTime * 0.55;

        float e = 0.045;
        float hC = height(p, t);
        float hX = height(p + vec2(e, 0.0), t);
        float hY = height(p + vec2(0.0, e), t);
        vec3 n = normalize(vec3((hC - hX) / e, 0.9, (hC - hY) / e));

        vec3 lightDir = normalize(vec3((uMouse.x * 2.0 - 1.0) * 1.3, 0.75, -(uMouse.y * 2.0 - 1.0) * 1.3));
        float diff = clamp(dot(n, lightDir), 0.0, 1.0);
        float spec = pow(clamp(dot(normalize(lightDir + vec3(0.0, 1.0, 0.0)), n), 0.0, 1.0), 90.0);

        vec3 deep = vec3(0.015, 0.02, 0.06);
        vec3 mid = vec3(0.09, 0.13, 0.36);
        vec3 accent = vec3(0.45, 0.35, 1.0);
        vec3 glint = vec3(0.75, 0.85, 1.0);
        vec3 col = mix(deep, mid, hC) + accent * diff * 0.22 + glint * spec;

        float vig = 1.0 - dot(uv - 0.5, uv - 0.5) * 1.1;
        gl_FragColor = vec4(col * vig, 1.0);
      }
    `;

    const VERT = 'attribute vec2 aPos; void main() { gl_Position = vec4(aPos, 0.0, 1.0); }';

    const compile = (type, source) => {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      return shader;
    };

    const program = gl.createProgram();
    gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT));
    gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      canvas.remove();
      return;
    }
    gl.useProgram(program);

    const buffer = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(program, 'aPos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const uRes = gl.getUniformLocation(program, 'uRes');
    const uTime = gl.getUniformLocation(program, 'uTime');
    const uMouse = gl.getUniformLocation(program, 'uMouse');

    const mouse = { x: 0.5, y: 0.35, tx: 0.5, ty: 0.35 };
    let rafId = 0;
    let visible = true;
    const startTime = performance.now();

    const resize = () => {
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      canvas.width = Math.round(root.clientWidth * dpr);
      canvas.height = Math.round(root.clientHeight * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.uniform2f(uRes, canvas.width, canvas.height);
    };

    const draw = (time) => {
      gl.uniform1f(uTime, time);
      gl.uniform2f(uMouse, mouse.x, mouse.y);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    };

    const frame = (now) => {
      rafId = 0;
      if (!visible) return;
      mouse.x += (mouse.tx - mouse.x) * 0.05;
      mouse.y += (mouse.ty - mouse.y) * 0.05;
      draw((now - startTime) * 0.001);
      rafId = requestAnimationFrame(frame);
    };

    const schedule = () => {
      if (!rafId && visible) rafId = requestAnimationFrame(frame);
    };

    resize();

    if (reduceMotion) {
      draw(8);
      window.addEventListener('resize', () => {
        resize();
        draw(8);
      });
      return;
    }

    window.addEventListener('resize', resize);

    root.addEventListener('pointermove', (event) => {
      const rect = root.getBoundingClientRect();
      mouse.tx = (event.clientX - rect.left) / rect.width;
      mouse.ty = (event.clientY - rect.top) / rect.height;
    });

    if ('IntersectionObserver' in window) {
      new IntersectionObserver((entries) => {
        visible = entries[0].isIntersecting;
        schedule();
      }).observe(root);
    }

    schedule();
  });
})();
</script>
<!-- ▲▲▲ COPY END ▲▲▲ -->
</body>
</html>
