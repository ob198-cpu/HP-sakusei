<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PARTS 02 — コンステレーション背景</title>
<style>body { margin: 0; }</style>
</head>
<body>
<!-- ▼▼▼ COPY START ▼▼▼ -->
<!-- ============================================================
  SAKUTTO PARTS 02: コンステレーション(星座)ネットワーク背景
  使い方: このブロックを丸ごと <body> 内に貼り付け。
  中のHTML(見出しなど)は .skp-cn-inner の中を自由に差し替え可。
  依存: なし(バニラJS)
============================================================ -->
<section class="skp-cn">
  <canvas class="skp-cn-canvas" aria-hidden="true"></canvas>
  <div class="skp-cn-inner">
    <h2>NETWORK SECTION</h2>
    <p>マウスに反応して星がつながる背景。中身は自由に差し替えできます。</p>
  </div>
</section>
<style>
  .skp-cn {
    position: relative;
    min-height: 60vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: #070811;
  }

  .skp-cn-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .skp-cn-inner {
    position: relative;
    z-index: 1;
    padding: 60px 24px;
    text-align: center;
    color: #eef0ff;
    font-family: 'Inter', 'Noto Sans JP', system-ui, sans-serif;
    pointer-events: none;
  }

  .skp-cn-inner h2 {
    margin: 0 0 12px;
    font-size: clamp(1.8rem, 4vw, 3rem);
    font-weight: 900;
    letter-spacing: 0.08em;
  }

  .skp-cn-inner p {
    margin: 0;
    color: rgba(210, 215, 250, 0.72);
  }
</style>
<script>
(() => {
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('.skp-cn').forEach((root) => {
    const canvas = root.querySelector('.skp-cn-canvas');
    const ctx = canvas.getContext('2d');
    if (!ctx) return;
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    let W = 0;
    let H = 0;
    let nodes = [];
    const mouse = { x: -9999, y: -9999 };
    const LINK = 130;
    let rafId = 0;
    let visible = true;

    const build = () => {
      W = root.clientWidth;
      H = root.clientHeight;
      canvas.width = Math.round(W * DPR);
      canvas.height = Math.round(H * DPR);
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      const count = Math.min(Math.round((W * H) / 11000), 140);
      nodes = Array.from({ length: count }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        vx: (Math.random() - 0.5) * 0.45,
        vy: (Math.random() - 0.5) * 0.45,
        r: 1 + Math.random() * 1.6,
      }));
    };

    const frame = () => {
      rafId = 0;
      if (!visible) return;
      ctx.clearRect(0, 0, W, H);

      for (const n of nodes) {
        n.x += n.vx;
        n.y += n.vy;
        if (n.x < 0 || n.x > W) n.vx *= -1;
        if (n.y < 0 || n.y > H) n.vy *= -1;
      }

      ctx.lineWidth = 1;
      for (let i = 0; i < nodes.length; i += 1) {
        const a = nodes[i];
        for (let j = i + 1; j < nodes.length; j += 1) {
          const b = nodes[j];
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d < LINK) {
            ctx.strokeStyle = `rgba(125, 100, 255, ${(1 - d / LINK) * 0.32})`;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
        const md = Math.hypot(a.x - mouse.x, a.y - mouse.y);
        if (md < LINK * 1.4) {
          ctx.strokeStyle = `rgba(120, 200, 255, ${(1 - md / (LINK * 1.4)) * 0.5})`;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(mouse.x, mouse.y);
          ctx.stroke();
        }
        ctx.fillStyle = 'rgba(205, 210, 255, 0.9)';
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
        ctx.fill();
      }

      rafId = requestAnimationFrame(frame);
    };

    const schedule = () => {
      if (!rafId && visible) rafId = requestAnimationFrame(frame);
    };

    build();

    if (reduceMotion) {
      frame();
      visible = false;
      return;
    }

    window.addEventListener('resize', build);

    root.addEventListener('pointermove', (event) => {
      const rect = root.getBoundingClientRect();
      mouse.x = event.clientX - rect.left;
      mouse.y = event.clientY - rect.top;
    });

    root.addEventListener('pointerleave', () => {
      mouse.x = -9999;
      mouse.y = -9999;
    });

    if ('IntersectionObserver' in window) {
      new IntersectionObserver((entries) => {
        visible = entries[0].isIntersecting;
        schedule();
      }).observe(root);
    }

    schedule();
  });
})();
</script>
<!-- ▲▲▲ COPY END ▲▲▲ -->
</body>
</html>
